<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Fountain Care — Report a problem</title>
<style>
:root{--ink:#183d36;--muted:#60736d;--green:#216452;--paper:#f6f7f2;--line:#dce4dc}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}header{padding:23px 5%;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:white}.brand{font-weight:750;font-size:21px;letter-spacing:-.7px}.badge,.eyebrow{text-transform:uppercase;font-size:11px;letter-spacing:1.6px;font-weight:700}.badge{background:#edf1e7;padding:7px 11px;border-radius:5px}main{max-width:1100px;margin:55px auto;padding:0 25px;display:grid;grid-template-columns:1fr 440px;gap:85px}.intro{padding-top:25px}h1{font-size:clamp(38px,5vw,60px);line-height:1.07;letter-spacing:-2.7px;margin:18px 0 24px}h2{font-size:28px;line-height:1.2;letter-spacing:-.8px;margin:12px 0}h3{font-size:16px;margin:0 0 5px}p{margin:10px 0 20px}.muted{color:var(--muted)}.intro>p{max-width:410px;font-size:18px}.illustration{margin:34px 0;width:100%;height:180px}.facts{border-top:1px solid var(--line);padding-top:20px;display:flex;gap:28px;font-size:13px}.facts strong{display:block}.phone{background:white;border:1px solid var(--line);border-radius:22px;padding:27px;box-shadow:0 15px 45px #213c3110}.topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.step{font-size:12px;color:var(--muted)}.back{background:none;border:0;color:var(--green);padding:8px 0;text-align:left}.asset{background:#f1f5ee;border:1px solid var(--line);border-radius:12px;padding:17px;margin:20px 0}.asset p{font-size:13px;margin:3px 0}.tag{font-size:11px;letter-spacing:1px;color:var(--green)}.primary,.secondary{display:block;min-height:48px;width:100%;border-radius:9px;padding:12px 18px;font-weight:650;margin-top:14px}.primary{background:var(--green);color:white;border:1px solid var(--green)}.secondary{background:white;color:var(--green);border:1px solid var(--line)}button:hover{filter:brightness(.96)}button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #c79b35;outline-offset:3px}.note{font-size:12px;color:var(--muted);margin:14px 0 0}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;border:0;padding:0;margin:20px 0}.choices legend{font-weight:650;margin-bottom:12px}.choice{display:flex;align-items:center;gap:8px;border:1px solid var(--line);padding:14px 10px;border-radius:9px;cursor:pointer;min-height:60px}.choice:has(input:checked){background:#eaf4ec;border-color:var(--green)}input[type=radio]{accent-color:var(--green);width:18px;height:18px}label.field{display:block;font-size:14px;font-weight:600;margin-top:17px}textarea,input[type=email]{display:block;width:100%;border:1px solid #aebfb5;border-radius:8px;padding:12px;margin-top:7px}textarea{resize:vertical;min-height:80px}input[type=file]{display:block;width:100%;font-size:12px;margin-top:9px}.optional{font-weight:400;color:var(--muted)}.success{width:53px;height:53px;border-radius:50%;display:grid;place-items:center;background:#e7f2e7;color:var(--green);font-size:28px}.reference{font-size:27px;letter-spacing:2px;font-weight:700;margin:5px 0}.timeline{list-style:none;padding:0;margin:26px 0}.timeline li{position:relative;margin-left:10px;padding:0 0 25px 28px;border-left:2px solid var(--line);color:var(--muted)}.timeline li:last-child{border:0;padding-bottom:0}.timeline li:before{content:'';position:absolute;left:-7px;top:4px;width:12px;height:12px;border-radius:50%;background:#dce4dc;border:2px solid white}.timeline li.done{color:var(--ink)}.timeline li.done:before{background:var(--green)}.timeline p{font-size:13px;margin:4px 0 0}.error{color:#a73127;font-size:14px}footer{max-width:1050px;margin:25px auto;padding:20px 25px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}details{margin-top:16px}summary{cursor:pointer}#preview{max-width:100%;max-height:130px;border-radius:8px;margin-top:10px}[hidden]{display:none!important}@media(max-width:800px){main{grid-template-columns:1fr;gap:25px;max-width:500px;margin:24px auto}.intro{padding:0}.intro h1{font-size:38px}.intro>p{font-size:16px}.illustration,.facts{display:none}.phone{padding:23px}header{padding:17px 22px}.badge{font-size:9px}footer{margin-top:15px}}
/* One mobile-width layout on every device. */
html{min-height:100%;background:var(--paper)}
body{width:100%;max-width:440px;min-height:100vh;min-height:100dvh;margin:0 auto;background:white;box-shadow:0 0 40px #213c310c}
header{padding:20px 24px;justify-content:flex-start}
main{display:block;max-width:none;margin:0;padding:0}
.phone{min-width:0;border:0;border-radius:0;padding:28px 24px;box-shadow:none}
footer{max-width:none;margin:0 24px;padding:20px 0 28px}
.choices{min-width:0;grid-template-columns:repeat(2,minmax(0,1fr))}
.choice{min-width:0;overflow-wrap:anywhere}
input[type=radio]{flex-shrink:0}
.topline{flex-wrap:wrap;gap:8px}
@media(max-width:350px){header{padding:18px 20px}.phone{padding:24px 20px}footer{margin:0 20px}.choices{grid-template-columns:1fr}}
</style></head>
<body><header><div class="brand">◉ Fountain Care</div></header>
<main>
<section class="phone" aria-label="Interactive fountain reporting prototype"><div id="screen"></div></section></main>
<footer>This is a student prototype. Facility details and reports are fictional. Nothing is sent to a council or maintenance team. <details><summary>Facilitator controls</summary><p>Start at the simulated fountain label. After submitting, use the control below to demonstrate possible later updates.</p><button class="secondary" id="advance">Show next example status</button><button class="secondary" id="reset">Restart test and clear this report</button><p id="facilitator" aria-live="polite"></p></details></footer>
<script>
const screen=document.getElementById('screen');let page='entry',status=0,report=null,photoURL=null;const draft={issue:'',notes:'',email:'',photo:null};
const asset=()=>`<div class="asset"><span class="tag">DEMO FACILITY · DP-014</span><h3>Dutton Park · Drinking fountain</h3><p>Example location: beside the walking path</p></div>`;
function render(){screen.innerHTML=page==='entry'?`<span class="eyebrow">At the drinking fountain</span><h2>Something not right?</h2><p class="muted">Report a leak, damage or a cleanliness concern.</p>${asset()}<button class="primary" id="start">Open reporting page →</button><p class="note">For this test, this button simulates scanning the QR label attached to the fountain.</p>`:page==='form'?`<div class="topline"><button class="back" id="back">← Back</button><span class="step">1 / 2 · Report details</span></div><h2>What’s the problem?</h2><p class="muted">The fountain ID is already filled in.</p>${asset()}<button class="back" id="wrong">Not this fountain?</button><p id="locationHelp" class="note" hidden>This demo supports DP-014 only. In a real service, scan the label on the correct fountain. Do not submit against the wrong ID.</p><form id="form"><fieldset class="choices"><legend>Select the main issue</legend>${['Leaking','Dirty / unhygienic','Damaged','No water','Other'].map((x,i)=>`<label class="choice"><input type="radio" name="issue" value="${x}" required ${draft.issue===x?'checked':''}>${x}</label>`).join('')}</fieldset><label class="field" for="notes">Anything else? <span class="optional">(optional)</span></label><textarea id="notes" maxlength="500" placeholder="For example, water keeps running after releasing the button."></textarea><label class="field" for="photo">Add a photo <span class="optional">(optional)</span></label><input type="file" id="photo" accept="image/*"><p id="photoName" class="note"></p><img id="preview" alt="Selected report photo" hidden><label class="field" for="email">Email for updates <span class="optional">(optional)</span></label><input type="email" id="email" placeholder="you@example.com"><p class="note">You can continue without an email. This prototype does not send notifications.</p><p class="error" id="error" role="alert"></p><button class="primary" type="submit">Submit report →</button></form>`:page==='confirmation'?`<div class="topline"><span class="step">2 / 2 · Confirmation</span><span class="tag">DEMO REPORT</span></div><div class="success">✓</div><h2>Report received</h2><p class="muted">Your concern has been recorded in this demo. It has not yet been reviewed or repaired.</p><div class="asset"><span class="tag">YOUR REFERENCE</span><div class="reference">${report.id}</div><p id="summary"></p></div><p>Keep this reference to identify your report.</p><button class="primary" id="track">View report progress →</button><button class="secondary" id="edit">Edit report details</button><p class="note">In a live service, your report would go to the responsible maintenance team.</p>`:`<button class="back" id="confirmation">← Report confirmation</button><h2>Report progress</h2><p class="muted">Reference ${report.id} · DP-014</p><ol class="timeline">${['Received','Under review','Repair scheduled','Resolved'].map((x,i)=>`<li class="${i<=status?'done':''}" ${i===status?'aria-current="step"':''}><strong>${x}${i===status?' · Current':''}</strong><p>${i>status?'Not yet reached':i===0?'The report has been recorded.':i===1?'Example update: the issue is being assessed.':i===2?'Example update: a repair visit is planned.':'Example update: the repair has been marked complete.'}</p></li>`).join('')}</ol><div class="asset"><h3>${status===3?'Repair marked complete':'Estimated repair time'}</h3><p>${status===3?'Example outcome for testing only.':'Not available in this demo. A live service should show an estimate only when provided by the maintenance team.'}</p></div><p class="note">Later statuses are simulated by the facilitator. They do not represent actual maintenance activity.</p>`;
if(page==='form'){document.getElementById('notes').value=draft.notes;document.getElementById('email').value=draft.email;showPhoto();document.getElementById('form').addEventListener('input',saveDraft);document.getElementById('photo').onchange=e=>{const file=e.target.files[0];if(file&&!file.type.startsWith('image/')){document.getElementById('error').textContent='Please choose an image file.';e.target.value='';return}if(photoURL)URL.revokeObjectURL(photoURL);draft.photo=file||null;photoURL=file?URL.createObjectURL(file):null;showPhoto()};document.getElementById('form').onsubmit=e=>{e.preventDefault();saveDraft();report={id:report?.id||'FC-DEMO-001'};status=0;go('confirmation')};}
if(page==='confirmation')document.getElementById('summary').textContent=`${draft.issue} · Dutton Park drinking fountain`;
const actions={start:()=>go('form'),back:()=>go('entry'),wrong:()=>document.getElementById('locationHelp').hidden=false,track:()=>go('status'),edit:()=>go('form'),confirmation:()=>go('confirmation')};for(const [id,fn]of Object.entries(actions)){const el=document.getElementById(id);if(el)el.onclick=fn}}
function saveDraft(){draft.issue=document.querySelector('input[name=issue]:checked')?.value||'';draft.notes=document.getElementById('notes').value;draft.email=document.getElementById('email').value}
function showPhoto(){document.getElementById('photoName').textContent=draft.photo?draft.photo.name:'';const img=document.getElementById('preview');img.hidden=!photoURL;if(photoURL)img.src=photoURL;else img.removeAttribute('src')}
function go(next){page=next;render();const heading=screen.querySelector('h2');heading.tabIndex=-1;heading.focus({preventScroll:true})}
document.getElementById('advance').onclick=()=>{if(!report){document.getElementById('facilitator').textContent='Submit a report first.';return}status=Math.min(3,status+1);go('status');document.getElementById('facilitator').textContent=status===3?'Final example status reached.':'Example status advanced.'};document.getElementById('reset').onclick=()=>{if(photoURL)URL.revokeObjectURL(photoURL);photoURL=null;report=null;status=0;Object.assign(draft,{issue:'',notes:'',email:'',photo:null});document.getElementById('facilitator').textContent='Ready for the next participant.';go('entry')};render();
</script></body></html>
